services:
  - type: web
    name: a-nossa-historia
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: a-nossa-historia-db
          property: connectionString
      - key: NODE_ENV
        value: production
databases:
  - name: a-nossa-historia-db
    plan: basic-256mb
    databaseName: a_nossa_historia
    user: historia_user
